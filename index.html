<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; connect-src 'self' https://mg-sa-backend.onrender.com http://localhost:3000 http://127.0.0.1:3000 http://127.0.0.1:5500; img-src 'self' data: blob: https://mg-sa-backend.onrender.com http://localhost:3000 http://127.0.0.1:3000;">
  <title>MG-SA Admin - Login</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>MG-SA Admin</h1>
        <p>Definitive Mods</p>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div style="position:relative">
            <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" style="padding-right:40px">
            <button type="button" onclick="togglePass('loginPass',this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1rem"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button class="btn-submit" id="loginBtn" onclick="doLogin()">SIGN IN</button>
        <div style="text-align:center;margin-top:16px">
          <a onclick="showForm('forgot')" style="color:var(--accent-orange);font-size:.82rem;cursor:pointer">Forgot password?</a>
        </div>
        <div id="authError" class="auth-error"></div>
      </div>

      <!-- LOGIN VERIFY FORM -->
      <div id="loginVerifyForm" style="display:none">
        <p style="color:var(--text-secondary);font-size:.85rem;margin-bottom:16px;text-align:center">Enter the 6-digit code sent to your email</p>
        <div class="form-group">
          <label>Verification Code</label>
          <input type="text" id="loginVerifyCode" placeholder="000000" maxlength="6" style="text-align:center;font-size:1.4rem;letter-spacing:6px">
        </div>
        <button class="btn-submit" id="loginVerifyBtn" onclick="doLoginVerify()">VERIFY</button>
        <div style="text-align:center;margin-top:16px">
          <a onclick="cancelVerification()" style="color:var(--accent-orange);font-size:.82rem;cursor:pointer">Cancel and go back</a>
        </div>
        <div id="loginVerifyError" class="auth-error"></div>
      </div>

      <!-- FORGOT PASSWORD FORM -->
      <div id="forgotForm" style="display:none">
        <p style="color:var(--text-secondary);font-size:.85rem;margin-bottom:16px;text-align:center">Enter your email to receive a verification code</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="forgotEmail" placeholder="admin@example.com" autocomplete="email">
        </div>
        <button class="btn-submit" id="forgotBtn" onclick="sendResetCode()">SEND CODE</button>
        <div style="text-align:center;margin-top:16px">
          <a onclick="showForm('login')" style="color:var(--accent-orange);font-size:.82rem;cursor:pointer">Back to login</a>
        </div>
        <div id="forgotError" class="auth-error"></div>
      </div>

      <!-- RESET PASSWORD FORM -->
      <div id="resetForm" style="display:none">
        <p style="color:var(--text-secondary);font-size:.85rem;margin-bottom:16px;text-align:center">Enter the 6-digit code and your new password</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="resetEmail" placeholder="admin@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Verification Code</label>
          <input type="text" id="resetCode" placeholder="000000" maxlength="6" style="text-align:center;font-size:1.4rem;letter-spacing:6px">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <div style="position:relative">
            <input type="password" id="resetPass" placeholder="Min 6 characters" autocomplete="new-password" style="padding-right:40px">
            <button type="button" onclick="togglePass('resetPass',this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1rem"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button class="btn-submit" id="resetBtn" onclick="resetPassword()">RESET PASSWORD</button>
        <div style="text-align:center;margin-top:16px">
          <a onclick="showForm('forgot')" style="color:var(--accent-orange);font-size:.82rem;cursor:pointer">Request new code</a>
        </div>
        <div id="resetError" class="auth-error"></div>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://mg-sa-backend.onrender.com';
    let loginAttempts = 0;
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_MS = 300000;

    const hasToken = !!sessionStorage.getItem('adminToken');
    const pendingEmail = sessionStorage.getItem('pendingLoginEmail');

    // CASE 1: Already have valid token -> LOGOUT (user hit back from dashboard)
    if (hasToken) {
      sessionStorage.removeItem('adminToken');
      sessionStorage.removeItem('adminUser');
      sessionStorage.removeItem('pendingLoginEmail');
    }
    // CASE 2: Has pendingEmail but NO token -> stale state -> CLEAR
    else if (pendingEmail) {
      sessionStorage.removeItem('pendingLoginEmail');
      sessionStorage.removeItem('adminToken');
      sessionStorage.removeItem('adminUser');
    }
    // CASE 3: Clean entry (no token, no pendingEmail) -> clear any stale lockout
    else {
      sessionStorage.removeItem('adminLoginLocked');
    }

    // Handle bfcache restore - always clear stale state and reset form
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        sessionStorage.removeItem('pendingLoginEmail');
        sessionStorage.removeItem('adminToken');
        sessionStorage.removeItem('adminUser');
        // Reset form inputs and button states
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginBtn').disabled = false;
        document.getElementById('forgotEmail').value = '';
        document.getElementById('forgotBtn').disabled = false;
        document.getElementById('resetCode').value = '';
        document.getElementById('resetPass').value = '';
        document.getElementById('resetBtn').disabled = false;
        // Reset to login form and clear errors
        ['loginForm','loginVerifyForm','forgotForm','resetForm'].forEach(id => {
          document.getElementById(id).style.display = 'none';
        });
        document.getElementById('loginForm').style.display = 'block';
        document.querySelectorAll('.auth-error').forEach(el => el.classList.remove('show'));
        // Reset password inputs to password type
        document.getElementById('loginPass').type = 'password';
        document.getElementById('resetPass').type = 'password';
      }
    });

    function togglePass(inputId, btn) {
      const inp = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    function showForm(form) {
      ['loginForm','loginVerifyForm','forgotForm','resetForm'].forEach(id => {
        document.getElementById(id).style.display = 'none';
      });
      document.querySelectorAll('.auth-error').forEach(el => el.classList.remove('show'));

      if (form === 'login') document.getElementById('loginForm').style.display = 'block';
      else if (form === 'loginVerify') document.getElementById('loginVerifyForm').style.display = 'block';
      else if (form === 'forgot') document.getElementById('forgotForm').style.display = 'block';
      else if (form === 'reset') document.getElementById('resetForm').style.display = 'block';
    }

    function cancelVerification() {
      sessionStorage.removeItem('pendingLoginEmail');
      document.getElementById('loginVerifyCode').value = '';
      // Reset login form state
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginPass').type = 'password';
      showForm('login');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }

    // LOGIN
    async function doLogin() {
      if (loginAttempts >= MAX_ATTEMPTS) {
        const locked = parseInt(sessionStorage.getItem('adminLoginLocked') || '0');
        if (Date.now() - locked < LOCKOUT_MS) {
          return showError('authError', 'Too many attempts. Wait 5 minutes.');
        }
        loginAttempts = 0;
      }

      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;

      if (!email || !pass) return showError('authError', 'Fill in all fields');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('authError', 'Invalid email');

      document.getElementById('loginBtn').disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Login failed');

        if (data.requiresVerification) {
          sessionStorage.setItem('pendingLoginEmail', data.email);
          document.getElementById('loginVerifyCode').value = '';
          document.getElementById('loginBtn').disabled = false;
          showForm('loginVerify');
          return;
        }

        throw new Error('Unexpected response');
      } catch (e) {
        loginAttempts++;
        if (loginAttempts >= MAX_ATTEMPTS) {
          sessionStorage.setItem('adminLoginLocked', Date.now().toString());
        }
        showError('authError', e.message);
      }

      document.getElementById('loginBtn').disabled = false;
    }

    // LOGIN VERIFY - ONLY way to get a token
    async function doLoginVerify() {
      const email = sessionStorage.getItem('pendingLoginEmail');
      if (!email) { showForm('login'); return; }

      const code = document.getElementById('loginVerifyCode').value.trim();
      if (!code || code.length !== 6) return showError('loginVerifyError', 'Enter 6-digit code');

      document.getElementById('loginVerifyBtn').disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/verify-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Verification failed');
        if (data.user.role !== 'admin') throw new Error('Admin access only');

        sessionStorage.removeItem('pendingLoginEmail');
        sessionStorage.setItem('adminToken', data.token);
        sessionStorage.setItem('adminUser', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (e) {
        showError('loginVerifyError', e.message);
      }

      document.getElementById('loginVerifyBtn').disabled = false;
    }

    // FORGOT PASSWORD
    async function sendResetCode() {
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) return showError('forgotError', 'Enter your email');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('forgotError', 'Invalid email');

      document.getElementById('forgotBtn').disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed');

        document.getElementById('resetEmail').value = email;
        showForm('reset');
      } catch (e) {
        showError('forgotError', e.message);
      }

      document.getElementById('forgotBtn').disabled = false;
    }

    // RESET PASSWORD
    async function resetPassword() {
      const email = document.getElementById('resetEmail').value.trim();
      const code = document.getElementById('resetCode').value.trim();
      const newPass = document.getElementById('resetPass').value;

      if (!email || !code || !newPass) return showError('resetError', 'Fill in all fields');
      if (code.length !== 6) return showError('resetError', 'Code must be 6 digits');
      if (newPass.length < 6) return showError('resetError', 'Password min 6 characters');

      document.getElementById('resetBtn').disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, newPassword: newPass })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed');

        showForm('login');
        showError('authError', 'Password reset! Login with your new password.');
      } catch (e) {
        showError('resetError', e.message);
      }

      document.getElementById('resetBtn').disabled = false;
    }

    // Enter key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('loginForm').style.display !== 'none') doLogin();
        else if (document.getElementById('loginVerifyForm').style.display !== 'none') doLoginVerify();
        else if (document.getElementById('forgotForm').style.display !== 'none') sendResetCode();
        else if (document.getElementById('resetForm').style.display !== 'none') resetPassword();
      }
    });
  </script>
</body>
</html>
