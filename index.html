<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 http://127.0.0.1:5500; img-src 'self' data: blob: http://localhost:3000 http://127.0.0.1:3000;">
  <title>MG-SA Admin - Login</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>MG-SA Admin</h1>
        <p>Definitive Mods</p>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn-submit" id="loginBtn" onclick="doLogin()">SIGN IN</button>
        <div style="text-align:center;margin-top:16px">
          <a onclick="showForm('forgot')" style="color:var(--accent-orange);font-size:.82rem;cursor:pointer">Forgot password?</a>
        </div>
        <div id="authError" class="auth-error"></div>
      </div>

      <!-- FORGOT PASSWORD FORM -->
      <div id="forgotForm" style="display:none">
        <p style="color:var(--text-secondary);font-size:.85rem;margin-bottom:16px;text-align:center">Enter your email to receive a verification code</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="forgotEmail" placeholder="admin@example.com" autocomplete="email">
        </div>
        <button class="btn-submit" id="forgotBtn" onclick="sendResetCode()">SEND CODE</button>
        <div style="text-align:center;margin-top:16px">
          <a onclick="showForm('login')" style="color:var(--accent-orange);font-size:.82rem;cursor:pointer">Back to login</a>
        </div>
        <div id="forgotError" class="auth-error"></div>
      </div>

      <!-- RESET PASSWORD FORM -->
      <div id="resetForm" style="display:none">
        <p style="color:var(--text-secondary);font-size:.85rem;margin-bottom:16px;text-align:center">Enter the 6-digit code and your new password</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="resetEmail" placeholder="admin@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Verification Code</label>
          <input type="text" id="resetCode" placeholder="000000" maxlength="6" style="text-align:center;font-size:1.4rem;letter-spacing:6px">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="resetPass" placeholder="Min 6 characters" autocomplete="new-password">
        </div>
        <button class="btn-submit" id="resetBtn" onclick="resetPassword()">RESET PASSWORD</button>
        <div style="text-align:center;margin-top:16px">
          <a onclick="showForm('forgot')" style="color:var(--accent-orange);font-size:.82rem;cursor:pointer">Request new code</a>
        </div>
        <div id="resetError" class="auth-error"></div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000';
    let loginAttempts = 0;
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_MS = 300000;

    function showForm(form) {
      document.getElementById('loginForm').style.display = form === 'login' ? 'block' : 'none';
      document.getElementById('forgotForm').style.display = form === 'forgot' ? 'block' : 'none';
      document.getElementById('resetForm').style.display = form === 'reset' ? 'block' : 'none';
      // Clear errors
      document.querySelectorAll('.auth-error').forEach(el => el.classList.remove('show'));
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }

    // LOGIN
    async function doLogin() {
      if (loginAttempts >= MAX_ATTEMPTS) {
        const locked = parseInt(sessionStorage.getItem('adminLoginLocked') || '0');
        if (Date.now() - locked < LOCKOUT_MS) {
          return showError('authError', 'Too many attempts. Wait 5 minutes.');
        }
        loginAttempts = 0;
      }

      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;

      if (!email || !pass) return showError('authError', 'Fill in all fields');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('authError', 'Invalid email');

      document.getElementById('loginBtn').disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Login failed');
        if (data.user.role !== 'admin') throw new Error('Admin access only');

        sessionStorage.setItem('adminToken', data.token);
        sessionStorage.setItem('adminUser', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (e) {
        loginAttempts++;
        if (loginAttempts >= MAX_ATTEMPTS) {
          sessionStorage.setItem('adminLoginLocked', Date.now().toString());
        }
        showError('authError', e.message);
      }

      document.getElementById('loginBtn').disabled = false;
    }

    // FORGOT PASSWORD
    async function sendResetCode() {
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) return showError('forgotError', 'Enter your email');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('forgotError', 'Invalid email');

      document.getElementById('forgotBtn').disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed');

        // Move to reset form
        document.getElementById('resetEmail').value = email;
        showForm('reset');
      } catch (e) {
        showError('forgotError', e.message);
      }

      document.getElementById('forgotBtn').disabled = false;
    }

    // RESET PASSWORD
    async function resetPassword() {
      const email = document.getElementById('resetEmail').value.trim();
      const code = document.getElementById('resetCode').value.trim();
      const newPass = document.getElementById('resetPass').value;

      if (!email || !code || !newPass) return showError('resetError', 'Fill in all fields');
      if (code.length !== 6) return showError('resetError', 'Code must be 6 digits');
      if (newPass.length < 6) return showError('resetError', 'Password min 6 characters');

      document.getElementById('resetBtn').disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, newPassword: newPass })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed');

        // Success - go back to login
        showForm('login');
        showError('authError', 'Password reset! Login with your new password.');
        document.getElementById('authError').style.color = 'var(--accent-teal)';
      } catch (e) {
        showError('resetError', e.message);
      }

      document.getElementById('resetBtn').disabled = false;
    }

    // Enter key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('loginForm').style.display !== 'none') doLogin();
        else if (document.getElementById('forgotForm').style.display !== 'none') sendResetCode();
        else if (document.getElementById('resetForm').style.display !== 'none') resetPassword();
      }
    });

    // Auto-redirect if logged in
    if (sessionStorage.getItem('adminToken')) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
