<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; connect-src 'self' https://mg-sa-backend.onrender.com http://localhost:3000 http://127.0.0.1:3000; img-src 'self' data: blob: https://mg-sa-backend.onrender.com http://localhost:3000 http://127.0.0.1:3000;">
  <title>MG-SA Admin - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>MG-SA Admin</h2>
        <p>Definitive Mods</p>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="active"><span class="icon"><i class="fa-solid fa-chart-line"></i></span><span class="nav-text">Dashboard</span></a>
        <a href="mods.html"><span class="icon"><i class="fa-solid fa-cube"></i></span><span class="nav-text">Mods</span></a>
        <a href="users.html"><span class="icon"><i class="fa-solid fa-users"></i></span><span class="nav-text">Usuarios</span></a>
        <a href="suggestions.html"><span class="icon"><i class="fa-solid fa-lightbulb"></i></span><span class="nav-text">Sugerencias</span></a>
        <a href="comments.html"><span class="icon"><i class="fa-solid fa-comments"></i></span><span class="nav-text">Comentarios</span></a>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fa-solid fa-chevron-left"></i></button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
          <h1>Dashboard</h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-user">
            <div class="avatar" id="userAvatar">A</div>
            <span id="userName">Admin</span>
          </div>
          <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
        </div>
      </header>

      <div class="page-content">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px">
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-cube" style="color:var(--accent-orange)"></i></div>
            <div class="stat-value" id="totalMods">0</div>
            <div class="stat-label">Total Mods</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-users" style="color:var(--accent-teal)"></i></div>
            <div class="stat-value" id="totalUsers">0</div>
            <div class="stat-label">Usuarios</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-download" style="color:var(--accent-yellow)"></i></div>
            <div class="stat-value" id="totalDownloads">0</div>
            <div class="stat-label">Descargas</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-lightbulb" style="color:var(--accent-pink)"></i></div>
            <div class="stat-value" id="totalSuggestions">0</div>
            <div class="stat-label">Sugerencias</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!checkAuth()) throw new Error('Not authenticated');

    async function loadStats() {
      try {
        const [mods, users, suggestions] = await Promise.all([
          apiRequest('/api/mods'),
          apiRequest('/api/users'),
          apiRequest('/api/suggestions')
        ]);

        document.getElementById('totalMods').textContent = mods.mods?.length || 0;
        document.getElementById('totalUsers').textContent = users.users?.length || 0;
        document.getElementById('totalSuggestions').textContent = suggestions.suggestions?.length || 0;

        const totalDownloads = (mods.mods || []).reduce((sum, m) => sum + (m.downloads || 0), 0);
        document.getElementById('totalDownloads').textContent = totalDownloads;
      } catch (e) {
        console.error('Failed to load stats:', e);
      }
    }

    loadStats();
  </script>
</body>
</html>
